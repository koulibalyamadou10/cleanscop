[package]
name = "cleanscope"
version = "0.1.0"
description = "CleanScope — junk-file scanner proof of concept"
authors = ["koulibalyamadou10"]
edition = "2021"

[lib]
name = "cleanscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
trash = "5"
sysinfo = "0.33"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
